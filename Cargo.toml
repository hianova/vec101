[package]
name = "vec101"
version = "0.1.0"
edition = "2024"
description = "A no_std, branchless, AVX2/NEON/GPU-accelerated 1.58-bit weight engine for maximum inference efficiency."
license = "MIT"
repository = "https://github.com/hianova/vec101"
keywords = ["no_std", "simd", "neon", "machine-learning", "1-bit"]
categories = ["science::machine-learning", "hardware-support", "no-std"]
readme = "README.md"

[features]
default = ["std"]
std = []
gpu-metal = ["metal", "objc"]
cuda = ["cudarc"]

[dependencies]
libm = "0.2.8"
rayon = "1.12.0"
cudarc = { version = "0.11", optional = true, features = ["cublas"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.28", optional = true }
objc = { version = "0.2.7", optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[dev-dependencies]
criterion = "0.5.1"
loom = "0.7.2"
rand = "0.8.5"
candle-core = "0.8.0"
anyhow = "1.0"

[[bench]]
name = "benchmark"
path = "benches/benchmark.rs"
harness = false

[[bench]]
name = "perf_bench"
path = "benches/perf_bench.rs"
harness = false

[[bench]]
name = "overhead"
path = "benches/overhead.rs"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
