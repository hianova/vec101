[package]
name = "vec101"
version = "0.1.0"
edition = "2024"
description = "A no_std, branchless, AVX2-accelerated 1-bit weight engine for maximum efficiency."
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/vec101"
keywords = ["no_std", "simd", "avx2", "machine-learning", "1-bit"]

[features]
default = ["std"]
std = []
gpu-metal = ["metal", "objc"]
gpu-cuda = ["cuda-core", "cuda-device"]
gpu-vulkan = []
gpu-wgpu = []

[dependencies]
dualcache-ff = { version = "0.4.1", optional = true, default-features = false }
libm = "0.2.8"
memmap2 = "0.9.10"
safetensors = "0.7.0"

cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", optional = true }
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.28", optional = true }
objc = { version = "0.2.7", optional = true }

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[dev-dependencies]
criterion = "0.5.1"
loom = "0.7.2"
rand = "0.8.5"

[[bench]]
name = "perf_bench"
harness = false

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
