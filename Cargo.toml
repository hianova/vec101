[package]
name = "vec101"
version = "1.1.0"
edition = "2024"
rust-version = "1.97"
description = "A no_std, branchless, AVX2/NEON/GPU-accelerated 1.58-bit weight engine for maximum inference efficiency."
license = "MIT"
repository = "https://github.com/hianova/vec101"
keywords = ["no_std", "simd", "neon", "machine-learning", "1-bit"]
categories = ["science::machine-learning", "hardware-support", "no-std"]
readme = "README.md"

[features]
default = ["std"]
std = ["rayon", "no_std_tool/std"]
gpu-metal = ["metal", "objc"]
cuda = ["cudarc"]

[dependencies]
cudarc = { version = "0.11", optional = true, features = ["cublas", "nvrtc"] }
no_std_tool = { workspace = true }
rayon = { version = "1.10", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.28", optional = true }
objc = { version = "0.2.7", optional = true }

[dev-dependencies]
rand = { workspace = true }
anyhow = { workspace = true }

[[bench]]
name = "benchmark"
path = "benches/benchmark.rs"
harness = false

